<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>0元抽奖 卡皮巴拉给你好果汁</title>
    <style>
        :root {
            --capybara-brown: #6e473b;   /* 卡皮巴拉标志性醇厚棕 */
            --pearl-amber: #e2a038;      /* 黄金珍奶琥珀金 */
            --milktea-bg: #f4e6d4;       /* 丝滑奶茶底色 */
            --milk-white: #ffffff;       /* 纯净牛奶白 */
            --text-dark: #4a2e25;        /* 焦糖深褐文字 */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--milktea-bg);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 0 30px 0;
        }

        /* 1. 顶部中奖轮播通知 - 升级为卡皮巴拉深棕半透明 */
        .marquee-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: rgba(62, 39, 32, 0.9);
            color: #fff;
            font-size: 13px;
            padding: 8px 15px;
            overflow: hidden;
            white-space: nowrap;
            z-index: 100;
        }
        .marquee-text {
            display: inline-block;
            animation: marquee 12s linear infinite;
        }
        @keyframes marquee {
            0% { transform: translateX(100vw); }
            100% { transform: translateX(-100%); }
        }

        /* 头部标题 */
        .header-title {
            text-align: center;
            color: var(--capybara-brown);
            margin-bottom: 20px;
        }
        .header-title h1 { font-size: 32px; font-weight: bold; letter-spacing: 1px; }
        .header-title p { font-size: 15px; color: #8a6458; margin-top: 5px; font-weight: 500; }

        /* 2. 九宫格抽奖区域 */
        .lottery-box {
            width: 92%;
            max-width: 450px;
            background-color: var(--capybara-brown);
            border-radius: 24px;
            padding: 14px;
            box-shadow: 0 12px 28px rgba(110, 71, 59, 0.25);
            margin-bottom: 20px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-gap: 10px;
            background-color: #fffbf7; /* 细腻浓醇的乳白内胆 */
            border-radius: 16px;
            padding: 10px;
        }

        .grid-item {
            background-color: var(--milk-white);
            border-radius: 12px;
            aspect-ratio: 1; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            font-size: 11px; 
            color: var(--text-dark);
            font-weight: bold;
            padding: 8px 4px;
            text-align: center;
            border: 3px solid transparent;
            transition: all 0.1s ease;
            line-height: 1.3;
            position: relative;
            overflow: hidden;
        }

        /* 奖品图片占位块 */
        .prize-img-wrapper {
            width: 55%;
            aspect-ratio: 1;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .prize-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 4px;
        }

        /* 默认占位底色图 */
        .img-placeholder {
            width: 100%;
            height: 100%;
            background-color: #fcf1e3;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        /* 顺时针点亮：变为高亮的黄金琥珀色，并带有温暖的奶茶色内敛阴影 */
        .grid-item.active {
            border-color: var(--pearl-amber);
            background-color: #fffaf2;
            box-shadow: inset 0 0 10px rgba(226, 160, 56, 0.2);
            transform: scale(1.03);
        }

        /* 抽奖按钮样式 - 升级为香槟珍奶金渐变 */
        .draw-btn {
            background: linear-gradient(135deg, #e0e0e0, #c0c0c0);
            color: #666;
            cursor: pointer;
            font-weight: bold;
            font-size: 18px;
            justify-content: center;
        }
        .draw-btn.ready {
            background: linear-gradient(135deg, #f5cb83 0%, var(--pearl-amber) 100%);
            color: white;
            text-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
        .draw-btn p { font-size: 11px; font-weight: normal; margin-top: 4px; opacity: 0.9;}

        /* 3. 底部查看奖品按钮 */
        .action-btn {
            width: 92%;
            max-width: 450px;
            background-color: #c49377; /* 温润柔和的浅卡其卡皮巴拉毛色 */
            color: #fff;
            text-align: center;
            padding: 14px 0;
            border-radius: 14px;
            font-size: 17px;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(110, 71, 59, 0.15);
        }

        /* 4. 弹窗样式 */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(62, 39, 32, 0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 999;
            padding: 20px;
        }
        .modal-content {
            background-color: var(--milk-white);
            width: 100%;
            max-width: 350px;
            border-radius: 20px;
            padding: 22px;
            text-align: center;
            position: relative;
            box-shadow: 0 10px 30px rgba(62, 39, 32, 0.25);
        }
        .modal-close {
            position: absolute;
            top: 12px; right: 16px;
            font-size: 22px; color: #a88c83;
            cursor: pointer;
        }
        
        /* 弹窗中的大图展示区域 */
        .prize-big-img-box {
            width: 130px;
            height: 130px;
            margin: 15px auto;
            background-color: #fffbf7;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 1px solid #f2e4d8;
        }
        .prize-big-img-box img {
            width: 90%;
            height: 90%;
            object-fit: contain;
        }
        .prize-big-placeholder {
            font-size: 55px;
        }

        .form-group {
            margin-top: 14px;
            text-align: left;
        }
        .form-group label {
            font-size: 13px; color: var(--text-dark); display: block; margin-bottom: 5px;
            font-weight: bold;
        }
        .form-group input {
            width: 100%;
            padding: 11px;
            border: 1px solid #dcd1c4;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            background-color: #fdfcfb;
            color: var(--text-dark);
        }
        .form-group input:focus { 
            border-color: var(--pearl-amber); 
            background-color: var(--milk-white);
            box-shadow: 0 0 0 3px rgba(226, 160, 56, 0.15);
        }

        .submit-btn {
            width: 100%;
            background-color: var(--capybara-brown);
            color: white;
            padding: 13px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            margin-top: 20px;
            box-shadow: 0 4px 12px rgba(110, 71, 59, 0.3);
        }
    </style>
</head>
<body>

    <div class="marquee-container">
        <div class="marquee-text">
            恭喜 尾号3211 获得黄金珍奶！&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
            恭喜 尾号2627 获得葡萄乳酪奶绿！&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; 恭喜 尾号5230 获得红茶玛奇朵！&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; 恭喜 尾号7663 获得黄金珍奶！&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
            恭喜 尾号0743 获得比利时酥酪金乌龙奶茶！
        </div>
    </div>

    <div class="header-title">
        <h1>0元抽奖</h1>
        <p>卡皮巴拉给你好果汁</p>
    </div>

    <div class="lottery-box">
        <div class="grid-container">
            <div class="grid-item item-0">
                <div class="prize-img-wrapper">
                    <img src="image/101.png" alt="黄金珍奶" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                    <div class="img-placeholder" style="display:none;">🧋</div>
                </div>
                <div class="prize-name">黄金珍奶</div>
            </div>
            
            <div class="grid-item item-1">
                <div class="prize-img-wrapper">
                    <img src="image/102.png" alt="烤糖粉粿冬瓜柠檬茶" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                    <div class="img-placeholder" style="display:none;">🍹</div>
                </div>
                <div class="prize-name">烤糖粉粿冬瓜柠檬茶</div>
            </div>
            
            <div class="grid-item item-2">
                <div class="prize-img-wrapper">
                    <img src="image/103.png" alt="布蕾咸芝士奶绿" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                    <div class="img-placeholder" style="display:none;">🍵</div>
                </div>
                <div class="prize-name">布蕾咸芝士奶绿</div>
            </div>
            
            <div class="grid-item item-7">
                <div class="prize-img-wrapper">
                    <img src="image/104.png" alt="比利时酥酪金乌龙奶茶" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                    <div class="img-placeholder" style="display:none;">🧋</div>
                </div>
                <div class="prize-name">比利时酥酪金乌龙奶茶</div>
            </div>
            
            <div class="grid-item draw-btn ready" id="drawBtn">
                <div>点击抽奖</div>
                <p id="chanceText">剩余1次</p>
            </div>
            
            <div class="grid-item item-3">
                <div class="prize-img-wrapper">
                    <img src="image/105.png" alt="酥酪芒果夹心奶绿" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                    <div class="img-placeholder" style="display:none;">🧋</div>
                </div>
                <div class="prize-name">酥酪芒果夹心奶绿</div>
            </div>
            
            <div class="grid-item item-6">
                <div class="prize-img-wrapper">
                    <img src="image/106.png" alt="葡萄乳酪奶绿" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                    <div class="img-placeholder" style="display:none;">🍉</div>
                </div>
                <div class="prize-name">葡萄乳酪奶绿</div>
            </div>
            
            <div class="grid-item item-5">
                <div class="prize-img-wrapper">
                    <img src="image/107.png" alt="香草籽抹茶拿铁" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                    <div class="img-placeholder" style="display:none;">🥛</div>
                </div>
                <div class="prize-name">香草籽抹茶拿铁</div>
            </div>
            
            <div class="grid-item item-4">
                <div class="prize-img-wrapper">
                    <img src="image/108.png" alt="红茶玛奇朵" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                    <div class="img-placeholder" style="display:none;">☕</div>
                </div>
                <div class="prize-name">红茶玛奇朵</div>
            </div>
        </div>
    </div>

    <div class="action-btn" id="myPrizeBtn">我的奖品</div>

    <div class="modal-overlay" id="prizeModal">
        <div class="modal-content">
            <span class="modal-close" id="closeModal">&times;</span>
            <h3 style="color: var(--capybara-brown);">恭喜获得奖品！</h3>
            
            <div class="prize-big-img-box">
                <img id="modalPrizeImg" src="" alt="奖品大图" style="display: none;">
                <div id="modalPrizePlaceholder" class="prize-big-placeholder">🎁</div>
            </div>
            <p id="modalPrizeName" style="font-weight: bold; color: var(--pearl-amber); margin-bottom: 12px; font-size: 16px;">未中奖</p>
            
            <hr style="border: 0; border-top: 1px dashed #e5dacb;">

            <div class="form-group">
                <label>收件人姓名</label>
                <input type="text" id="username" placeholder="请输入姓名">
            </div>
            <div class="form-group">
                <label>甜度偏好</label>
                <input type="text" id="address" placeholder="请输入加几粒糖">
            </div>
            <div class="form-group">
                <label>茶饮想要时间</label>
                <input type="tel" id="telephone" placeholder="请联系2627告诉他">
            </div>

            <button class="submit-btn" id="submitBtn">点击寄送</button>
        </div>
    </div>

    <script>
        const clockwiseItems = [
            document.querySelector('.item-0'),
            document.querySelector('.item-1'),
            document.querySelector('.item-2'),
            document.querySelector('.item-3'),
            document.querySelector('.item-4'),
            document.querySelector('.item-5'),
            document.querySelector('.item-6'),
            document.querySelector('.item-7')
        ];

        let isRolling = false;     
        let hasWon = false;        
        let currentPrize = null;   

        const drawBtn = document.getElementById('drawBtn');
        const chanceText = document.getElementById('chanceText');
        const myPrizeBtn = document.getElementById('myPrizeBtn');
        const prizeModal = document.getElementById('prizeModal');
        const closeModal = document.getElementById('closeModal');
        const submitBtn = document.getElementById('submitBtn');

        // 统一路径反斜杠兼容性处理
        document.querySelectorAll('.prize-img-wrapper img').forEach(img => {
            let currentSrc = img.getAttribute('src');
            if(currentSrc) {
                img.setAttribute('src', currentSrc.replace(/\\/g, '/'));
            }
            if(!img.getAttribute('src')) {
                img.style.display = 'none';
                if(img.nextElementSibling) img.nextElementSibling.style.display = 'flex';
            }
        });

        drawBtn.addEventListener('click', () => {
            if (isRolling) return;
            if (hasWon) {
                alert('您已经抽过奖啦，点击“我的奖品”查看！');
                return;
            }

            isRolling = true;
            drawBtn.classList.remove('ready');
            chanceText.innerText = "剩余0次";

            // 1. 动态计算全随机中奖索引目标
            const randomTargetIndex = Math.floor(Math.random() * 8);

            let currentIndex = 0; 
            
            // 2. 环绕算法：基础前行25格（确保在顺时针方向狂奔至少3整圈，仪式感拉满）
            let steps = 25 + randomTargetIndex;        
            let baseSpeed = 80; 

            function roll() {
                clockwiseItems.forEach(item => item.classList.remove('active'));
                
                let activeIdx = currentIndex % 8;
                clockwiseItems[activeIdx].classList.add('active');

                steps--;
                if (steps > 0) {
                    currentIndex++;
                    
                    // 3. 拟物阻尼缓动减速逻辑（最后6步平滑平稳顺时针定格）
                    let dynamicSpeed = baseSpeed;
                    if (steps < 6) {
                        dynamicSpeed += (6 - steps) * 45; 
                    }
                    
                    setTimeout(roll, dynamicSpeed);
                } else {
                    isRolling = false;
                    hasWon = true;
                    
                    const targetedItem = clockwiseItems[activeIdx];
                    const imgEl = targetedItem.querySelector('img');
                    const placeholderEl = targetedItem.querySelector('.img-placeholder');
                    
                    currentPrize = {
                        name: targetedItem.querySelector('.prize-name').innerText,
                        src: imgEl ? imgEl.getAttribute('src') : '',
                        fallbackIcon: placeholderEl ? placeholderEl.innerText : '🎁'
                    };
                    
                    setTimeout(() => {
                        openPrizeModal();
                    }, 500);
                }
            }
            roll();
        });

        function openPrizeModal() {
            if (!hasWon) {
                alert('您还没有抽奖哦！');
                return;
            }
            
            const modalImg = document.getElementById('modalPrizeImg');
            const modalPlaceholder = document.getElementById('modalPrizePlaceholder');
            
            document.getElementById('modalPrizeName').innerText = currentPrize.name;
            
            if (currentPrize.src) {
                modalImg.src = currentPrize.src;
                modalImg.style.display = 'block';
                modalPlaceholder.style.display = 'none';
            } else {
                modalImg.style.display = 'none';
                modalPlaceholder.style.display = 'block';
                modalPlaceholder.innerText = currentPrize.fallbackIcon;
            }
            
            prizeModal.style.display = 'flex';
        }

        myPrizeBtn.addEventListener('click', openPrizeModal);
        closeModal.addEventListener('click', () => prizeModal.style.display = 'none');

        // 修改后的点击寄送逻辑
        submitBtn.addEventListener('click', () => {
            const name = document.getElementById('username').value.trim();
            const addr = document.getElementById('address').value.trim();
            const tel = document.getElementById('telephone').value.trim();

            if (!name || !addr || !tel) {
                alert('请完整填写所有收件信息！');
                return;
            }

            // 👈 核心改动：加入全新特定的截图和通知提醒
            alert('请记得截图告诉2627');

            setTimeout(() => {
                if (typeof WeixinJSBridge !== "undefined") {
                    WeixinJSBridge.call("closeWindow"); 
                } else {
                    window.close(); 
                    window.location.href = "about:blank"; 
                }
            }, 1000);
        });
    </script>
</body>
</html>
